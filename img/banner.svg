<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" fill="none">
    <defs>
        <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0b0f19"/>
            <stop offset="50%" stop-color="#0f172a"/>
            <stop offset="100%" stop-color="#1e1b4b"/>
        </linearGradient>
        <linearGradient id="nova-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#38bdf8"/>
            <stop offset="50%" stop-color="#818cf8"/>
            <stop offset="100%" stop-color="#c084fc"/>
        </linearGradient>
        <radialGradient id="glow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#6366f1" stop-opacity="0.25"/>
            <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
        </radialGradient>
    </defs>
    
    <!-- Background -->
    <rect width="1200" height="400" fill="url(#bg-grad)"/>
    <circle cx="600" cy="200" r="350" fill="url(#glow)"/>
    
    <!-- Central Nova Emblem -->
    <g transform="translate(550, 70)">
        <circle cx="50" cy="50" r="46" stroke="url(#nova-grad)" stroke-width="2.5" stroke-dasharray="8 6" opacity="0.6"/>
        <circle cx="50" cy="50" r="38" stroke="#818cf8" stroke-width="1.5" opacity="0.4"/>
        <path d="M50 14 L58 42 L86 50 L58 58 L50 86 L42 58 L14 50 L42 42 Z" fill="url(#nova-grad)"/>
        <circle cx="50" cy="50" r="6" fill="#ffffff"/>
    </g>
    
    <!-- Brand Name -->
    <text x="600" y="240" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="800" letter-spacing="8" fill="#f8fafc">
        NOVA <tspan fill="#818cf8" font-weight="300">PANEL</tspan>
    </text>
    
    <!-- Tagline -->
    <text x="600" y="285" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="500" letter-spacing="4" fill="#94a3b8">
        NEXT-GENERATION GAME SERVER MANAGEMENT PLATFORM
    </text>
    <text x="600" y="325" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400" letter-spacing="2" fill="#64748b">
        One-Command Installer &bull; Direct IP, Domain &amp; Tunnel Access &bull; Pterodactyl Core Engine
    </text>
</svg>
