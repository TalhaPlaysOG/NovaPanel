<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" fill="none">
    <defs>
        <linearGradient id="nova-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#38bdf8"/>
            <stop offset="50%" stop-color="#818cf8"/>
            <stop offset="100%" stop-color="#c084fc"/>
        </linearGradient>
        <linearGradient id="nova-glow" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0284c7" stop-opacity="0.8"/>
            <stop offset="100%" stop-color="#7c3aed" stop-opacity="0.8"/>
        </linearGradient>
        <filter id="glow-blur" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="3" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over"/>
        </filter>
    </defs>
    
    <!-- Emblem (Nova Starburst) -->
    <g transform="translate(10, 10)">
        <!-- Outer Orbital Rings -->
        <circle cx="50" cy="50" r="46" stroke="url(#nova-grad)" stroke-width="2.5" stroke-dasharray="8 6" opacity="0.6"/>
        <circle cx="50" cy="50" r="38" stroke="url(#nova-glow)" stroke-width="1.5" opacity="0.4"/>
        
        <!-- Glowing Core Background -->
        <circle cx="50" cy="50" r="22" fill="url(#nova-grad)" filter="url(#glow-blur)" opacity="0.3"/>
        
        <!-- Starburst / Diamond Core -->
        <path d="M50 14 L58 42 L86 50 L58 58 L50 86 L42 58 L14 50 L42 42 Z" fill="url(#nova-grad)"/>
        
        <!-- Inner Center Pulse -->
        <circle cx="50" cy="50" r="6" fill="#ffffff"/>
        
        <!-- Corner Accents -->
        <circle cx="28" cy="28" r="2.5" fill="#38bdf8" opacity="0.8"/>
        <circle cx="72" cy="72" r="2.5" fill="#c084fc" opacity="0.8"/>
        <circle cx="72" cy="28" r="2" fill="#818cf8" opacity="0.7"/>
        <circle cx="28" cy="72" r="2" fill="#818cf8" opacity="0.7"/>
    </g>
    
    <!-- Typography -->
    <text x="130" y="65" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="4" fill="#0f172a">
        NOVA
    </text>
    <text x="280" y="65" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="44" font-weight="300" letter-spacing="3" fill="#6366f1">
        PANEL
    </text>
    
    <!-- Subtitle / Tagline -->
    <text x="132" y="94" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="6" fill="#64748b">
        NEXT-GEN GAME HOSTING
    </text>
</svg>
